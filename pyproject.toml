[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ollagraph-mcp"
version = "0.1.1"
description = "MCP server for Ollagraph — exposes 212 web-infrastructure tools (one per API endpoint) to AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ollagraph", email = "hi@ollagraph.com" }]
keywords = ["mcp", "ollagraph", "ai-agents", "web-scraping", "seo", "aeo"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "fastmcp>=0.4.0",
  "httpx>=0.28.0",
]

[project.urls]
Homepage = "https://ollagraph.com"
Documentation = "https://ollagraph.com/docs"
Repository = "https://github.com/vikasswaminh/ollagraph-mcp"
"Bug Tracker" = "https://github.com/vikasswaminh/ollagraph-mcp/issues"

[project.scripts]
ollagraph-mcp = "ollagraph_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ollagraph_mcp"]

[tool.hatch.build.targets.sdist]
include = [
  "src/ollagraph_mcp",
  "README.md",
  "LICENSE",
]
